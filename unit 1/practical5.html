<!DOCTYPE html>
<html>
    <head>
        <title> Complete html form</title>
    </head>
    <body>
        <h2> Registration Form</h2>
        <form>
            <!--Text input-->
            <label for="Full name"> Full name:</label>
            <input type="text"id="Full name"name="Full name"placeholder="Enter your name Full name"required>
            <br><br>
            <!--password-->
            <label for="Password"> Password:</label>
            <input type="Password"id="Password"name="Password"placeholder="Enter your name Password"required>
            <br><br>
            <!--Email-->
            <label for="Email"> Email:</label>
            <input type="Email"id="Email"name="Email"placeholder="Enter your name Email"required>
            <br><br>
            <!--date-->
            <label for="DoB"> Date of birth:</label>
            <input type="Date"id="Date"name="DOB"placeholder="Enter your name Date of birth"required>
            <br><br>
            <!--Number-->
            <label for="age"> age:</label>
            <input type="Number"id="age"name="age"min="18"max="60"required>
            <br><br>
            <!--Radio button-->
           <p> Gender:</p>
            <br>
            <label for="Male"> Male</label>
            <input type="radio"id="male"name="gender"value="male">
            <br><br>
            <label for="Female"> Female</label>
            <input type="radio"id="female"name="gender"value="female">
            <br><br>
            <!--Checkbox-->
           <p>Skills</p>
           <label for="HTML">HTML </label>
            <input type="Checkbox"id="html"name="skill"value="html">
            <br><br>
            <label for="CSS">CSS </label>
            <input type="Checkbox"id="css"name="skill"value="css">
            <br><br>
            <label for="JAVASCRIPTS">JAVASCRIPTS </label>
            <input type="Checkbox"id="javascripts"name="skill"value="javascripts">
            <br><br>
            <!--Select dropdown-->
            <label for="contry">country:</label>
            <select id="country"name="country">
                <option value ="country">--select--</option>
                <option value="India">india</option>
                <option value="USA">USA</option>
                <OPTION Value="UK">UK</OPTION>
                <option value=""CHINA">CHINA</option>
                <option value="AUSTRALIA">AUSTRALIA</option>
           </select>
           <br><br>
           <!--Textarea-->
           <label for="about">about you</label><br>
           <textarea id="about"name="about"rows="4"clos="40"placeholder="write yourself..."></textarea>
           <br> <br>
           <!--File upload-->
           <label for="resume">upload resume </label>
           <input type="file"id="resume"nmae="resume">
           <br> <br>
           <!--Range-->
           <label for="experience">experience</label>
           <input type="range"id="experience"name="experience"min="0"max="10">
           <br><br>
           <!--Button-->
           <button type="Submit">Submit</button>
           <button type="reset">reset</button>
        </form>
    </body>
</html>

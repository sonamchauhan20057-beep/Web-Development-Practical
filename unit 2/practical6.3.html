 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>External CSS Design</title>

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <style>
        /* Reset basic margin */
body {
    margin: 0;
    padding: 0;
    font-family: "Segoe UI", Tahoma, sans-serif;
    background-color: #1146c3;
}

/* Main container */
.container {
    width: 70%;
    margin: 60px auto;
    background-color: #bd2667;
    padding: 30px;
    border-radius: 8px;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
}

/* Heading style */
h1 {
    color: #080a0c;
    text-align: center;
    margin-bottom: 20px;
}

/* Paragraph style */
p {
    color: #0e0d0d;
    font-size: 16px;
    line-height: 1.6;
    text-align: justify;
}
/* Custom Variables for easy maintenance */
:root {
    --glass-bg: rgba(255, 255, 255, 0.15);
    --border-color: rgba(255, 255, 255, 0.3);
    --accent: #6c5ce7;
    --spacing: clamp(1rem, 5vw, 3rem); /* Responsive spacing */
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box; /* Crucial: padding/border stays inside the width */
}


    </style>

    <div class="container">
        <h1>Welcome to My Web Page</h1>
        <p>
            This is a simple example of using external CSS with HTML.
            External CSS helps keep the design separate from the structure,
            making the code clean, reusable, and easy to manage. 
            It is the best practice for real projects and portfolios.
        </p>
    </div>

</body>
</html>

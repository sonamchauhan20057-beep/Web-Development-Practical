<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            display: flex;
            -webkit-text-fill-color: black;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #7e9b0b; /* Light Grey Background */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .profile-card {
            background: rgb(250, 240, 240);
            padding: 30px;
            width: 350px;
            border-top: 5px solid #007bff; /* Blue top border */
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
        }

        .title {
            color: #007bff;
            font-size: 24px;
            margin-bottom: 10px;
        }

        .description {
            color: #444;
            font-size: 16px;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .skill-tag {
            background: #e7f3ff;
            color: #007bff;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="profile-card">
        <div class="title">Internal CSS</div>
        
        <p class="description">
            My name is <b>Sonam chauhan</b> I am learning HTML and CSS so that I can make better websites  <b>Internal CSS</b> 
            This is my Internal css practical</p>
        

        <span class="skill-tag">HTML</span>
        <span class="skill-tag">CSS</span>
        <span class="skill-tag">Responsive</span>
    </div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mastering Event Listeners</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f8f9fa;
            font-family: 'Segoe UI', sans-serif;
        }

        .box {
            width: 300px;
            height: 200px;
            background-color: #3498db;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 15px;
            cursor: pointer;
            transition: 0.3s;
            margin-bottom: 20px;
            font-weight: bold;
            text-align: center;
            padding: 10px;
        }

        .controls {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .key-display {
            margin-top: 10px;
            font-size: 1.2rem;
            color: #e67e22;
        }

        button {
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            margin: 5px;
        }

        .btn-stop { background-color: #e74c3c; color: white; }
        .btn-start { background-color: #2ecc71; color: white; }
    </style>
</head>
<body>
   <h2>Add interactivity using event listners</h2>
    <div class="box" id="interactBox">
        Mouse Over Me!
    </div>

    <div class="controls">
        <button class="btn-start" id="startBtn">Start Listeners</button>
        <button class="btn-stop" id="stopBtn">Stop Listeners</button>
        <div class="key-display" id="keyOutput">Press any key...</div>
    </div>

    <script>
        const box = document.getElementById('interactBox');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const keyOutput = document.getElementById('keyOutput');

        // --- Event Functions ---

        // Mouse Event Function
        function handleMouseMove() {
            const randomColor = Math.floor(Math.random()*16777215).toString(16);
            box.style.backgroundColor = "#" + randomColor;
            box.innerText = "Moving! #" + randomColor;
        }

        // Keyboard Event Function
        function handleKeyPress(event) {
            keyOutput.innerHTML = `Aapne dabaya: <b>${event.key}</b> (Code: ${event.keyCode})`;
        }

        // --- Start & Stop Logic ---

        // Function to Add Listeners
        function startAll() {
            // Mouse Listener
            box.addEventListener('mousemove', handleMouseMove);
            // Keyboard Listener (pure document par)
            document.addEventListener('keydown', handleKeyPress);
            
            box.innerText = "Listeners Active!";
            box.style.opacity = "1";
        }

        // Function to Remove Listeners
        function stopAll() {
            // Note: Remove karne ke liye wahi function name chahiye jo Add karte waqt tha
            box.removeEventListener('mousemove', handleMouseMove);
            document.removeEventListener('keydown', handleKeyPress);
            
            box.innerText = "Listeners Stopped!";
            box.style.backgroundColor = "#95a5a6";
            box.style.opacity = "0.7";
            keyOutput.innerText = "Listeners are OFF";
        }

        // Button Clicks
        startBtn.addEventListener('click', startAll);
        stopBtn.addEventListener('click', stopAll);

    </script>
</body>
</html>

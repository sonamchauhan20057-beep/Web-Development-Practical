<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Mega Shop Website</title>

<style>
body{
    font-family: Arial;
    margin:0;
    background:#f2f2f2;
}
header{
    background:#222;
    color:white;
    padding:15px;
    text-align:center;
}
nav{
    background:#444;
    padding:10px;
    text-align:center;
}
nav button{
    margin:5px;
    padding:8px 15px;
    border:none;
    cursor:pointer;
    background:#ff9800;
    color:white;
}
.search{
    text-align:center;
    margin:15px;
}
.search input{
    padding:8px;
    width:250px;
}
.section{
    display:none;
}
.products{
    display:grid;
    grid-template-columns:repeat(auto-fit,200px);
    gap:20px;
    padding:20px;
    justify-content:center;
}
.card{
    background:white;
    padding:15px;
    text-align:center;
    border-radius:8px;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
}
.card button{
    background:green;
    color:white;
    border:none;
    padding:6px 12px;
    cursor:pointer;
}
.cart{
    background:white;
    margin:20px;
    padding:15px;
    border-radius:8px;
}
.cart-item{
    display:flex;
    justify-content:space-between;
    margin-bottom:8px;
}
</style>
</head>

<body>

<header>
<h1>🛍️ Mega Shop Website</h1>
<p>Mobile | Clothing | Book Store</p>
</header>

<nav>
<button onclick="showSection('mobile')">📱 Mobile Shop</button>
<button onclick="showSection('clothing')">👕 Clothing Shop</button>
<button onclick="showSection('book')">📚 Book Store</button>
</nav>

<div class="search">
<input type="text" id="search" placeholder="Search product..." onkeyup="searchProduct()">
</div>

<!-- MOBILE SHOP -->
<div id="mobile" class="section">
<div class="products">
<div class="card"><h3>Samsung</h3><p>₹15000</p><button onclick="addToCart('Samsung',15000)">Add</button></div>
<div class="card"><h3>iPhone</h3><p>₹60000</p><button onclick="addToCart('iPhone',60000)">Add</button></div>
<div class="card"><h3>Redmi</h3><p>₹12000</p><button onclick="addToCart('Redmi',12000)">Add</button></div>
</div>
</div>

<!-- CLOTHING SHOP -->
<div id="clothing" class="section">
<div class="products">
<div class="card"><h3>T-Shirt</h3><p>₹500</p><button onclick="addToCart('T-Shirt',500)">Add</button></div>
<div class="card"><h3>Jeans</h3><p>₹1200</p><button onclick="addToCart('Jeans',1200)">Add</button></div>
<div class="card"><h3>Jacket</h3><p>₹2000</p><button onclick="addToCart('Jacket',2000)">Add</button></div>
</div>
</div>

<!-- BOOK STORE -->
<div id="book" class="section">
<div class="products">
<div class="card"><h3>C Programming</h3><p>₹350</p><button onclick="addToCart('C Programming',350)">Add</button></div>
<div class="card"><h3>Java Basics</h3><p>₹450</p><button onclick="addToCart('Java Basics',450)">Add</button></div>
<div class="card"><h3>Web Development</h3><p>₹500</p><button onclick="addToCart('Web Development',500)">Add</button></div>
</div>
</div>

<!-- CART -->
<div class="cart">
<h2>🧾 Cart</h2>
<div id="cartItems"></div>
<p><b>Total: ₹<span id="total">0</span></b></p>
<button onclick="clearCart()">Clear Cart</button>
</div>

<script>
// ================== JavaScript ==================

// Load cart from localStorage
let cart = JSON.parse(localStorage.getItem("cart")) || [];

// Show selected section
function showSection(id){
    let sections=document.getElementsByClassName("section");
    for(let i=0;i<sections.length;i++){
        sections[i].style.display="none";
    }
    document.getElementById(id).style.display="block";
}
showSection('mobile');

// Add to cart
function addToCart(name,price){
    let item=cart.find(p=>p.name===name);
    if(item){
        item.qty++;
    }else{
        cart.push({name,price,qty:1});
    }
    saveCart();
    updateCart();
}

// Increase quantity
function increase(index){
    cart[index].qty++;
    saveCart();
    updateCart();
}

// Decrease quantity
function decrease(index){
    if(cart[index].qty>1){
        cart[index].qty--;
    }else{
        cart.splice(index,1);
    }
    saveCart();
    updateCart();
}

// Update cart (DOM Manipulation)
function updateCart(){
    let div=document.getElementById("cartItems");
    div.innerHTML="";
    let total=0;

    cart.forEach((item,index)=>{
        total+=item.price*item.qty;
        div.innerHTML+=`
        <div class="cart-item">
        ${item.name} - ₹${item.price*item.qty}
        <div>
        <button onclick="decrease(${index})">-</button>
        ${item.qty}
        <button onclick="increase(${index})">+</button>
        </div>
        </div>`;
    });
    document.getElementById("total").innerText=total;
}
updateCart();

// Clear cart
function clearCart(){
    cart=[];
    saveCart();
    updateCart();
}

// Save cart
function saveCart(){
    localStorage.setItem("cart",JSON.stringify(cart));
}

// Search product
function searchProduct(){
    let input=document.getElementById("search").value.toLowerCase();
    let cards=document.getElementsByClassName("card");
    for(let i=0;i<cards.length;i++){
        let name=cards[i].getElementsByTagName("h3")[0].innerText.toLowerCase();
        cards[i].style.display=name.includes(input)?"block":"none";
    }
}
</script>

</body>
</html>
